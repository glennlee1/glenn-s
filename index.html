<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      id="siteDescription"
      name="description"
      content="Glenn导航 - 搜索与常用网站，一页直达"
    />
    <meta name="theme-color" content="#f2f2f2" id="themeColor" />
    <title>Glenn导航</title>
    <link rel="icon" href="./favicon.png" type="image/png" sizes="64x64" />
    <script>
      (function () {
        var theme = "";

        try {
          theme = localStorage.getItem("glenn-home-theme") || "";
        } catch (error) {
          theme = "";
        }

        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./style.css?v=7" />
  </head>
  <body>
    <a class="skip-link" href="#searchInput">跳到搜索框</a>

    <header class="site-header">
      <div class="header-inner">
        <a id="brandLink" class="brand" href="./" aria-label="返回 Glenn导航">
          <img id="brandMark" class="brand-mark" src="./assets/brand/glenn-cat.png" alt="" width="40" height="40" />
          <span id="siteTitle">Glenn导航</span>
        </a>
        <button id="siteSettingsToggle" class="site-settings-toggle" type="button" aria-label="编辑导航" title="编辑导航">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="mainContent" class="site-main">
      <div class="page-container">
        <section class="search-section" aria-label="网页搜索">
          <div class="search-stage">
            <div class="search-wrap">
              <form id="searchForm" class="search-form" role="search" novalidate>
                <button
                  id="engineToggle"
                  class="engine-toggle"
                  type="button"
                  aria-expanded="false"
                  aria-controls="enginePanel"
                  title="切换搜索引擎"
                >
                  <span id="engineBadge" class="engine-badge" aria-hidden="true">百</span>
                  <span class="sr-only">切换搜索引擎</span>
                </button>

                <label class="sr-only" for="searchInput">搜索关键词或网址</label>
                <input
                  id="searchInput"
                  class="search-input"
                  name="query"
                  type="text"
                  inputmode="search"
                  enterkeyhint="search"
                  autocomplete="off"
                  autocapitalize="off"
                  spellcheck="false"
                  placeholder="点击左侧切换搜索引擎~"
                />

                <button
                  id="searchClear"
                  class="search-clear"
                  type="button"
                  aria-label="清空搜索内容"
                  title="清空"
                  hidden
                >
                  &times;
                </button>
                <button id="searchButton" class="search-button" type="submit">GO</button>
              </form>

              <div
                id="enginePanel"
                class="engine-panel"
                role="group"
                aria-labelledby="enginePanelTitle"
                hidden
              >
                <strong id="enginePanelTitle" class="engine-panel-title">请选择搜索引擎：</strong>
                <ul id="engineList" class="engine-list"></ul>
              </div>

              <p id="searchStatus" class="sr-only" aria-live="polite"></p>
              <div class="search-featured" aria-label="摸鱼小游戏入口">
                <span aria-hidden="true">↗</span>
                <strong>surprise？！</strong>
                <a href="https://www.crazygames.com/" target="_blank" rel="noopener noreferrer">CrazyGames</a>
                <a href="https://poki.com/" target="_blank" rel="noopener noreferrer">Poki</a>
              </div>
            </div>

            <button
              id="themeToggle"
              class="theme-toggle"
              type="button"
              aria-label="切换到深色模式"
              title="切换到深色模式"
            >
              <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
              </svg>
              <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.35 17.66l-1.42 1.41M19.07 4.93l-1.41 1.42"></path>
              </svg>
            </button>
          </div>
        </section>

        <nav id="navigationGrid" class="navigation-grid" aria-label="常用网站导航"></nav>

        <section id="appEditor" class="app-editor" hidden aria-labelledby="appEditorTitle">
          <div class="app-editor-backdrop" data-editor-close></div>
          <div class="app-editor-dialog" role="dialog" aria-modal="true" aria-labelledby="appEditorTitle">
            <div class="app-editor-header">
              <h2 id="appEditorTitle">编辑导航</h2>
              <button id="appEditorClose" class="icon-button" type="button" aria-label="关闭编辑器" title="关闭">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 6l12 12M18 6L6 18"></path>
                </svg>
              </button>
            </div>

            <section class="identity-editor" aria-labelledby="identityEditorTitle">
              <div class="identity-editor-heading">
                <h3 id="identityEditorTitle">站点设置</h3>
                <span>名称和头像仅保存在当前浏览器</span>
              </div>
              <form id="siteIdentityForm" class="identity-editor-form" novalidate>
                <div class="identity-editor-fields">
                  <label>
                    <span>站点名称</span>
                    <input id="siteNameInput" name="siteName" type="text" maxlength="30" autocomplete="off" required />
                  </label>
                  <div class="avatar-field">
                    <span>头像</span>
                    <div class="avatar-editor-row">
                      <img id="siteAvatarPreview" class="avatar-preview" src="./assets/brand/glenn-cat.png" alt="头像预览" width="48" height="48" />
                      <input id="siteAvatarInput" type="file" accept="image/png,image/jpeg,image/webp" />
                      <button id="siteAvatarReset" class="secondary-button" type="button">恢复头像</button>
                    </div>
                  </div>
                </div>
                <div class="identity-editor-actions">
                  <button id="siteIdentityReset" class="text-button" type="button">恢复默认名称</button>
                  <button class="primary-button" type="submit">保存站点设置</button>
                </div>
              </form>
            </section>

            <section class="module-editor" aria-labelledby="moduleEditorTitle">
              <div class="module-editor-heading">
                <h3 id="moduleEditorTitle">导航模块</h3>
                <label>
                  <span>选择模块</span>
                  <select id="moduleSelect" name="module"></select>
                </label>
              </div>
              <div class="module-name-row">
                <label>
                  <span>模块名称</span>
                  <input id="moduleNameInput" type="text" maxlength="30" autocomplete="off" />
                </label>
                <button id="moduleNameSave" class="secondary-button" type="button">保存模块名</button>
              </div>
            </section>

            <form id="appEditorForm" class="app-editor-form" novalidate>
              <div class="app-editor-fields">
                <label>
                  <span>名称</span>
                  <input id="appNameInput" name="name" type="text" maxlength="30" autocomplete="off" required />
                </label>
                <label>
                  <span>网址</span>
                  <input id="appUrlInput" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/" required />
                </label>
              </div>
              <div class="app-editor-form-actions">
                <button id="appEditorCancel" class="secondary-button" type="button" hidden>取消编辑</button>
                <button id="appEditorSubmit" class="primary-button" type="submit">添加到导航</button>
              </div>
              <p id="appEditorStatus" class="app-editor-status" role="status" aria-live="polite"></p>
            </form>

            <div class="app-editor-list-header">
              <span id="appEditorListTitle">当前模块</span>
              <button id="appEditorReset" class="text-button" type="button">恢复默认</button>
            </div>
            <ul id="appEditorList" class="app-editor-list"></ul>
            <p class="app-editor-note">每个模块最多保留15个网址，修改仅保存在当前浏览器。</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>&copy; <span id="currentYear"></span> <span id="footerSiteTitle">Glenn导航</span></span>
        <span class="footer-separator" aria-hidden="true">·</span>
        <a href="https://github.com/glennlee1/glenn-s" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </footer>

    <noscript>
      <p class="noscript-message">此页面需要启用 JavaScript 才能显示导航内容。</p>
    </noscript>

    <script src="./config.js?v=8" defer></script>
    <script src="./catalog.js?v=8" defer></script>
    <script src="./app.js?v=8" defer></script>
  </body>
</html>
