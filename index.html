<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      id="siteDescription"
      name="description"
      content="Glenn's轻首页 - 搜索与常用网站，一页直达"
    />
    <meta name="theme-color" content="#f2f2f2" id="themeColor" />
    <title>Glenn's轻首页</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var theme = "";

        try {
          theme = localStorage.getItem("glenn-home-theme") || "";
        } catch (error) {
          theme = "";
        }

        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }

        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./style.css?v=2" />
  </head>
  <body>
    <a class="skip-link" href="#searchInput">跳到搜索框</a>

    <header class="site-header">
      <div class="header-inner">
        <a id="brandLink" class="brand" href="./" aria-label="返回 Glenn's轻首页">
          <img class="brand-mark" src="./favicon.svg" alt="" width="40" height="40" />
          <span id="siteTitle">Glenn's轻首页</span>
        </a>
      </div>
    </header>

    <main id="mainContent" class="site-main">
      <div class="page-container">
        <section class="search-section" aria-label="网页搜索">
          <div class="search-wrap">
            <form id="searchForm" class="search-form" role="search" novalidate>
              <button
                id="engineToggle"
                class="engine-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="enginePanel"
                title="切换搜索引擎"
              >
                <span id="engineBadge" class="engine-badge" aria-hidden="true">百</span>
                <span class="sr-only">切换搜索引擎</span>
              </button>

              <label class="sr-only" for="searchInput">搜索关键词或网址</label>
              <input
                id="searchInput"
                class="search-input"
                name="query"
                type="text"
                inputmode="search"
                enterkeyhint="search"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="点击左侧切换搜索引擎~"
              />

              <button
                id="searchClear"
                class="search-clear"
                type="button"
                aria-label="清空搜索内容"
                title="清空"
                hidden
              >
                &times;
              </button>
              <button id="searchButton" class="search-button" type="submit">GO</button>
            </form>

            <div
              id="enginePanel"
              class="engine-panel"
              role="group"
              aria-labelledby="enginePanelTitle"
              hidden
            >
              <strong id="enginePanelTitle" class="engine-panel-title">请选择搜索引擎：</strong>
              <ul id="engineList" class="engine-list"></ul>
            </div>

            <p id="searchStatus" class="sr-only" aria-live="polite"></p>
            <a class="search-featured" href="https://github.com/glennlee1" target="_blank" rel="noopener noreferrer">
              <span aria-hidden="true">↗</span> Glenn 的 GitHub
            </a>
          </div>
        </section>

        <nav id="navigationGrid" class="navigation-grid" aria-label="常用网站导航"></nav>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>&copy; <span id="currentYear"></span> <span id="footerSiteTitle">Glenn's轻首页</span></span>
        <span class="footer-separator" aria-hidden="true">·</span>
        <a href="https://github.com/glennlee1/glenn-s" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="footer-separator" aria-hidden="true">·</span>
        <button id="themeToggle" class="theme-toggle" type="button"># 深色模式 #</button>
      </div>
    </footer>

    <noscript>
      <p class="noscript-message">此页面需要启用 JavaScript 才能显示导航内容。</p>
    </noscript>

    <script src="./config.js?v=2" defer></script>
    <script src="./catalog.js?v=2" defer></script>
    <script src="./app.js?v=2" defer></script>
  </body>
</html>
